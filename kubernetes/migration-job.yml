apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration-job
spec:
  template:
    spec:
      containers:
      - name: migration
        image: <ACR_NAME>.azurecr.io/flight-app-backend:latest # Placeholder
        command: ["flask", "db", "upgrade"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 4
