version: '3.8'

networks:
  monitoring:
    driver: bridge

services:
  # Python Application Services
  product-service:
    build: ./product-service
    ports:
      - "5001:5001"
    environment:
      # Traces will be sent to the Grafana Agent
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-agent:4317
      - OTEL_SERVICE_NAME=product-service
    depends_on:
      - grafana-agent
    networks:
      - monitoring

  payment-service:
    build: ./payment-service
    ports:
      - "5002:5002"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-agent:4317
      - OTEL_SERVICE_NAME=payment-service
    depends_on:
      - grafana-agent
    networks:
      - monitoring

  checkout-service:
    build: ./checkout-service
    ports:
      - "5003:5003"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:5001
      - PAYMENT_SERVICE_URL=http://payment-service:5002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://grafana-agent:4317
      - OTEL_SERVICE_NAME=checkout-service
    depends_on:
      - product-service
      - payment-service
      - grafana-agent
    networks:
      - monitoring

  # Grafana Agent for collecting and forwarding telemetry
  grafana-agent:
    image: grafana/agent:latest
    volumes:
      - ./agent:/etc/agent # Mount the config directory
      - /var/run/docker.sock:/var/run/docker.sock # Required for log collection
    ports:
      - "4317:4317"  # OTLP endpoint
    # Pass environment variables from a .env file for security
    env_file: .env
    command:
      - "-config.file=/etc/agent/agent.yaml"
      - "-config.expand-env" # Enables the use of ${...} variables in the config
    networks:
      - monitoring
