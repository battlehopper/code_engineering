name: Build, Push, and Deploy to AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: <MyUniqueContainerRegistryName> # Substitua pelo nome do seu ACR
  AKS_CLUSTER_NAME: <MyAKSClusterName>      # Substitua pelo nome do seu AKS Cluster
  RESOURCE_GROUP: <MyResourceGroup>       # Substitua pelo nome do seu Resource Group

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # (O job de linting e build de validação permanece o mesmo)
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'
    - name: Install dependencies and lint
      run: |
        pip install -r product-service/requirements.txt && flake8 product-service/
        pip install -r payment-service/requirements.txt && flake8 payment-service/
        pip install -r checkout-service/requirements.txt && flake8 checkout-service/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Build validation
      run: |
        docker build --tag temp-image ./product-service
        docker build --tag temp-image ./payment-service
        docker build --tag temp-image ./checkout-service

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.ref == 'refs/heads/main' # Só executa o deploy na branch main

    steps:
    - uses: actions/checkout@v3

    # 1. Login no Azure
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 2. Login no Azure Container Registry (ACR)
    - name: ACR Login
      run: az acr login --name ${{ env.ACR_NAME }}

    # 3. Build e Push das imagens para o ACR
    - name: Build and Push Images
      run: |
        TAG=${{ github.sha }}
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/product-service:$TAG ./product-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/payment-service:$TAG ./payment-service
        docker build -t ${{ env.ACR_NAME }}.azurecr.io/checkout-service:$TAG ./checkout-service

        docker push ${{ env.ACR_NAME }}.azurecr.io/product-service:$TAG
        docker push ${{ env.ACR_NAME }}.azurecr.io/payment-service:$TAG
        docker push ${{ env.ACR_NAME }}.azurecr.io/checkout-service:$TAG

    # 4. Conectar ao Cluster AKS
    - name: Set AKS context
      uses: azure/aks-set-context@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        cluster-name: ${{ env.AKS_CLUSTER_NAME }}
        resource-group: ${{ env.RESOURCE_GROUP }}

    # 5. Substituir placeholders e aplicar manifestos
    - name: Deploy to AKS
      run: |
        TAG=${{ github.sha }}
        ACR_URL=${{ env.ACR_NAME }}.azurecr.io

        # Substituir placeholders nos arquivos de manifesto
        sed -i "s|<ACR_NAME>.azurecr.io/product-service:latest|$ACR_URL/product-service:$TAG|g" kubernetes/product-service.yml
        sed -i "s|<ACR_NAME>.azurecr.io/payment-service:latest|$ACR_URL/payment-service:$TAG|g" kubernetes/payment-service.yml
        sed -i "s|<ACR_NAME>.azurecr.io/checkout-service:latest|$ACR_URL/checkout-service:$TAG|g" kubernetes/checkout-service.yml

        # Aplicar os manifestos
        kubectl apply -f kubernetes/
