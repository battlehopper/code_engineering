name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies and lint for product-service
      run: |
        pip install -r product-service/requirements.txt
        flake8 product-service/

    - name: Install dependencies and lint for payment-service
      run: |
        pip install -r payment-service/requirements.txt
        flake8 payment-service/

    - name: Install dependencies and lint for checkout-service
      run: |
        pip install -r checkout-service/requirements.txt
        flake8 checkout-service/

  build-docker-images:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build product-service image
      uses: docker/build-push-action@v2
      with:
        context: ./product-service
        push: false # We only build to validate, not push

    - name: Build payment-service image
      uses: docker/build-push-action@v2
      with:
        context: ./payment-service
        push: false

    - name: Build checkout-service image
      uses: docker/build-push-action@v2
      with:
        context: ./checkout-service
        push: false
