# agent.yaml - Configuração do Grafana Agent para o ambiente Docker Compose

server:
  log_level: info

# Configuração para enviar métricas para o Grafana Cloud Prometheus
metrics:
  wal_directory: /tmp/wal
  global:
    scrape_interval: 15s
    remote_write:
      - url: ${GCLOUD_PROMETHEUS_REMOTE_WRITE_URL}
        basic_auth:
          username: ${GCLOUD_PROMETHEUS_USER}
          password: ${GCLOUD_API_KEY}
  configs:
    - name: integrations
      scrape_configs:
        # Scrape dos nossos microsserviços
        - job_name: 'microservices'
          static_configs:
            - targets: ['product-service:5001', 'payment-service:5002', 'checkout-service:5003']

# Configuração para enviar logs para o Grafana Cloud Loki
logs:
  configs:
    - name: integrations
      positions:
        filename: /tmp/positions.yaml
      scrape_configs:
        # Coleta logs de todos os contêineres Docker
        - job_name: docker
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
          relabel_configs:
            - source_labels: ['__meta_docker_container_name']
              regex: '/(.*)'
              target_label: 'container'
      clients:
        - url: ${GCLOUD_LOKI_URL}
          basic_auth:
            username: ${GCLOUD_LOKI_USER}
            password: ${GCLOUD_API_KEY}
          tenant_id: ${GCLOUD_TENANT_ID}

# Configuração para receber e enviar traces para o Grafana Cloud Tempo
traces:
  configs:
    - name: default
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      remote_write:
        - endpoint: ${GCLOUD_TEMPO_URL}
          basic_auth:
            username: ${GCLOUD_TEMPO_USER}
            password: ${GCLOUD_API_KEY}
      batch:
        timeout: 5s
        send_batch_size: 100
